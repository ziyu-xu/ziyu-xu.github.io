name: Hexo build

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hexo on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --engine-strict
      - name: Clean generated files
        run: npm run clean
      - name: Build blog
        run: npm run build
